services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiprate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Healthcheck polls PostgreSQL until it's actually ready to accept connections
    # pg_isready is a built-in PostgreSQL tool that checks if the server is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shiprate
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      # Wait for postgres healthcheck to pass before starting app
      # service_healthy = PostgreSQL is fully ready, not just the container started
      postgres:
        condition: service_healthy
      # Redis starts fast, service_started is sufficient
      redis:
        condition: service_started
    restart: on-failure

  shiprate-intelligence:
    build:
      context: ../shiprate-intelligence
    ports:
      - "8000:8000"
    environment:
      SHIPRATE_API_URL: http://app:8080
      SHIPRATE_API_USERNAME: admin
      SHIPRATE_API_PASSWORD: password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT: shiprate-intelligence
    depends_on:
      - app
      - postgres

volumes:
  postgres-data: